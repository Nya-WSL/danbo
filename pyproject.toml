[project]
name = "danbo"
version = "0.0.1"
description = "BILIBILI弹幕点歌bot"
authors = [
    {name = "Nya-WSL",email = "support@nya-wsl.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "pyinstaller (>=6.16.0,<7.0.0)",
    "nicegui (>=3.0.2,<4.0.0)",
    "qrcode[pil] (>=8.2,<9.0)",
    "requests (>=2.32.5,<3.0.0)",
    "brotli (>=1.1.0,<2.0.0)",
    "yarl (>=1.20.1,<2.0.0)",
    "aiohttp (>=3.12.15,<4.0.0)",
    "pure-protobuf (==3.1.2)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
