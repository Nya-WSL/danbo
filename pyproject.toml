[project]
name = "danbo"
version = "0.0.1"
description = "BILIBILI弹幕点歌bot"
authors = [{ name = "Nya-WSL", email = "support@nya-wsl.com" }]
requires-python = ">=3.10, <3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyinstaller (>=6.16.0,<7.0.0)",
    "nicegui==3.18.0",
    "qrcode[pil] (>=8.2,<9.0)",
    "requests (>=2.32.5,<3.0.0)",
    "brotli (>=1.1.0,<2.0.0)",
    "yarl (>=1.20.1,<2.0.0)",
    "aiohttp (>=3.12.15,<4.0.0)",
    "pure-protobuf (==3.1.2)",
    "loguru (>=0.7.3,<0.8.0)",
    "pywebview==6.2",
    "aioping (>=0.4.0,<0.5.0)",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true
